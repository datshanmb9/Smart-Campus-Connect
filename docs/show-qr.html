<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Connect - Campus QR Code (LH-204)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 14px;
    }
    .card-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .qr-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .hint {
      margin-top: 16px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .header, .actions, .hint {
        display: none;
      }
      .card-container {
        box-shadow: none;
        max-width: 100%;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">PRESIDENCY UNIVERSITY • MERNOVA X 2026</div>
    <h1>Smart Campus Connect Demonstration</h1>
    <p class="sub">Point your physical phone camera at the QR code below</p>
  </div>

  <div class="card-container">
    <img src="demo-campus-qr.png" alt="Smart Campus QR Code LH-204" class="qr-img">
  </div>

  <div class="actions">
    <button class="btn" onclick="toggleFullScreen()">🖥️ Full Screen Display</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Placard</button>
  </div>

  <p class="hint">Target Venue: <strong>LH-204</strong> (Academic Block 1, Floor 2) • QR Tag: <code>PU-ENGG-LH204</code></p>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
